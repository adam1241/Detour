name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format
        run: uv run ruff format --check .
      - name: mypy
        run: uv run mypy
      - name: unit tests
        run: uv run pytest -m "not db"

  spatial:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: detour
          POSTGRES_PASSWORD: detour
          POSTGRES_DB: detour_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U detour"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway credentials for the CI-only service container.
      DATABASE_URL: postgresql://detour:detour@localhost:5432/detour_test  # gitleaks:allow
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - name: spatial tests
        run: uv run pytest -m db

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
