[project]
name = "detour"
version = "0.1.0"
description = "Detour: AI road-trip planner mixing hotel nights with host-style stops (unofficial proof of concept)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.40",
    "jsonschema>=4.23",
    "psycopg[binary]>=3.2",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["agent", "db", "scripts", "evals"]

[tool.pytest.ini_options]
testpaths = ["agent/tests", "db/tests", "evals/tests"]
markers = ["db: needs a PostGIS database at DATABASE_URL"]
addopts = "-ra --strict-markers"

[[tool.mypy.overrides]]
# jsonschema and PyYAML ship no type hints; avoids adding stub packages.
module = ["boto3", "boto3.*", "botocore", "botocore.*", "jsonschema", "jsonschema.*", "yaml"]
ignore_missing_imports = true
